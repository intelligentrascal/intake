name: docs-gates

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README matches content-aware default
        run: python3 scripts/check_readme_name_template.py
      - name: Durable evidence images
        run: python3 scripts/check_durable_images.py
